name: CI

on:
  push:
    branches: [ main, feature_branch ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test script executable
        run: chmod +x test/run_build_sh_tests.sh

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check build.sh
        run: |
          bash -n build.sh

      - name: Run shellcheck on scripts
        run: |
          shellcheck build.sh
          shellcheck test/run_build_sh_tests.sh

      - name: Run build.sh tests
        run: ./test/run_build_sh_tests.sh

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build stage (scons)
        run: |
          ./build.sh
