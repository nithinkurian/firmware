name: CI

on:
  push:
    branches: [ main, feature_branch ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint (shellcheck + syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check build.sh
        run: bash -n build.sh

      - name: Run shellcheck on scripts
        run: |
          shellcheck build.sh
          shellcheck test/run_build_sh_tests.sh

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make test script executable
        run: chmod +x test/run_build_sh_tests.sh

      - name: Run build.sh tests
        run: ./test/run_build_sh_tests.sh

  build:
    name: Build (scons)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore scons build cache
        uses: actions/cache@v4
        with:
          path: build/scons
          key: ${{ runner.os }}-scons-${{ hashFiles('**/SConstruct') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build stage (scons)
        run: ./build.sh --build

      - name: Upload build artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scons-build
          path: build/scons
