name: CI

on:
  push:
    branches: [ main, feature_branch ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build (scons)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore scons build cache
        uses: actions/cache@v4
        with:
          path: build/scons
          key: ${{ runner.os }}-scons-${{ hashFiles('**/SConstruct') }}
          restore-keys: |
            ${{ runner.os }}-scons-

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Run build stage (scons)
        run: ./build.sh

      - name: Upload build artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scons-build
          path: build/scons
